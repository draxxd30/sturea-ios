name: Sturea

options:
  bundleIdPrefix: com.draxxd
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: es
    # Sin firma en CI: tú firmas el .ipa con AltStore / Sideloadly.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Sturea:
    type: application
    platform: iOS
    sources:
      - path: Sturea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.draxxd.sturea
        PRODUCT_NAME: Sturea
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # URL base de la Edge Function (NO es secreta). Reemplázala por la de tu proyecto
        # o déjala y cámbiala dentro de la app en Ajustes.
        API_BASE_URL: "https://TU-PROYECTO.supabase.co/functions/v1/grades-api"
    info:
      path: Sturea/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sturea
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        SturApiBaseURL: $(https://kqylabfllurrrcecxxxy.supabase.co/functions/v1/grades-api)
